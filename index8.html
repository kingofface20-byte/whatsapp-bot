<!DOCTYPE html>
<html lang="ps" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldConnect - Live Video Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0b132b; background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        .brand-header { text-align: center; margin-top: 5px; margin-bottom: 8px; }
        .brand-name { font-size: 20px; font-weight: 900; color: #38bdf8; }
        .brand-tagline { font-size: 10px; color: #94a3b8; font-weight: 600; }

        .container { width: 100%; max-width: 400px; background-color: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 18px 15px 25px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 5; margin-bottom: 25px; }

        .header { display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-size: 16px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 6px; }
        
        .go-live-btn { background: #ef4444; color: white; border: none; font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background-color: #0f172a; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-val { font-size: 14px; font-weight: 800; color: #38bdf8; }
        .stat-lbl { font-size: 9px; color: #94a3b8; margin-top: 1px; }

        .section-title { font-size: 11px; font-weight: 700; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }

        .grid-profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 340px; overflow-y: auto; padding-right: 4px; padding-bottom: 10px; }
        .grid-profiles::-webkit-scrollbar { width: 4px; }
        .grid-profiles::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .profile-card { background-color: #0f172a; border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s ease; position: relative; text-align: center; padding-bottom: 6px; }
        .profile-card.active { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); transform: scale(0.98); }
        .profile-img-container { position: relative; width: 100%; height: 110px; }
        .profile-img { width: 100%; height: 100%; object-fit: cover; background-color: #334155; }
        .flag-badge { position: absolute; top: 6px; right: 6px; font-size: 15px; background: rgba(0, 0, 0, 0.6); padding: 2px 6px; border-radius: 6px; backdrop-filter: blur(4px); }
        
        .profile-name { font-size: 12px; font-weight: 700; color: #f8fafc; margin-top: 4px; }
        .profile-status { font-size: 9px; color: #4ade80; display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: 1px; }
        .online-dot { width: 5px; height: 5px; background-color: #4ade80; border-radius: 50%; }

        .call-btn-container { display: none; }
        .generate-btn { background: #22c55e; color: white; width: 100%; padding: 12px; border: none; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3); }
        .generate-btn:active { transform: scale(0.98); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
