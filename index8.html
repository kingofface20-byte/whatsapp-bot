<!DOCTYPE html>
<html lang="ps" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldConnect - Live Video Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        .brand-header { text-align: center; margin-top: 2px; margin-bottom: 6px; }
        .brand-name { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-tagline { font-size: 10px; color: #94a3b8; font-weight: 600; }

        .container { width: 100%; max-width: 400px; background-color: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 18px 15px 25px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 5; margin-bottom: 25px; }

        .header { display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-size: 16px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 6px; }
        
        .go-live-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; background-color: rgba(15, 23, 42, 0.6); padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-val { font-size: 14px; font-weight: 800; color: #38bdf8; }
        .stat-lbl { font-size: 9px; color: #94a3b8; margin-top: 1px; }

        .section-title { font-size: 11px; font-weight: 700; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }

        .grid-profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 340px; overflow-y: auto; padding-right: 4px; padding-bottom: 10px; }
        .grid-profiles::-webkit-scrollbar { width: 4px; }
        .grid-profiles::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .profile-card { background-color: rgba(15, 23, 42, 0.7); border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.2s ease; position: relative; text-align: center; padding-bottom: 6px; }
        .profile-card.active { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); transform: scale(0.98); }
        .profile-img { width: 100%; height: 110px; object-fit: cover; }
        .profile-name { font-size: 12px; font-weight: 700; color: #f8fafc; margin-top: 4px; }
        .profile-status { font-size: 9px; color: #4ade80; display: flex; align-items: center; justify-content: center; gap: 3px; margin-top: 1px; }
        .online-dot { width: 5px; height: 5px; background-color: #4ade80; border-radius: 50%; }

        .call-btn-container { display: none; }
        .generate-btn { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; width: 100%; padding: 12px; border: none; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3); }
        .generate-btn:active { transform: scale(0.98); }

        .error-box { display: none; background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 10px; padding: 8px; text-align: center; font-size: 11px; color: #fca5a5; font-weight: bold; }

        .process-box { display: none; background-color: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px; text-align: center; }
        .process-text { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e); transition: width 0.3s ease; }

        .message-box { display: none; background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 12px; padding: 10px; text-align: center; font-size: 11px; color: #fca5a5; font-weight: bold; line-height: 1.3; }

        .live-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 100; flex-direction: column; justify-content: space-between; padding: 15px; }
        .live-header { display: flex; justify-content: space-between; align-items: center; z-index: 101; }
        .live-viewer-count { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.2); }
        .live-end-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .live-video-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 99; }
        
        .live-footer { z-index: 101; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 12px; border-radius: 16px; }
        .invite-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(56,189,248,0.3); }
        
        .invite-modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 15px; z-index: 105; max-height: 60vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .invite-modal-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; color: #f8fafc; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; }
        .invite-user-item { display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.6); padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; }
        .invite-user-info { display: flex; align-items: center; gap: 10px; }
